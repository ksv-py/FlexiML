name: CI

on:
 push:
 branches: [ main ]
 pull_request:
 branches: [ main ]

jobs:
 build:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - name: Set up Python
 uses: actions/setup-python@v4
 with:
 python-version: '3.11'
 - name: Install CI deps
 run: |
 python -m pip install --upgrade pip
 pip install -r backend/requirements-ci.txt
 - name: Smoke test
 run: |
 python - <<'PY'
 import fastapi, uvicorn
 print('OK')
 PY
